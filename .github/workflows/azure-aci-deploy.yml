name: Azure ACI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# GitHub OIDC permissions
permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-azure-aci-cicd
  AZURE_ACR: azureacicicd2026
  ACR_LOGIN_SERVER: azureacicicd2026.azurecr.io
  ACI_NAME: azure-aci-cicd
  IMAGE_NAME: azure-aci-cicd-demo
  ACI_PORT: "8080"

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure ACI
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Login to Azure using GitHub OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Verify Azure login
      - name: Verify Azure Login
        shell: bash
        run: |
          echo "Azure account:"
          az account show --output table

      # 4. Login to Azure Container Registry
      - name: Login to Azure Container Registry
        shell: bash
        run: |
          az acr login \
            --name "$AZURE_ACR"

      # 5. Build Docker image
      - name: Build Docker Image
        shell: bash
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            ./app

      # 6. Push Docker image to ACR
      - name: Push Docker Image to ACR
        shell: bash
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

      # 7. Delete existing ACI
      - name: Delete Existing ACI
        shell: bash
        run: |
          if az container show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACI_NAME" \
            --output none 2>/dev/null; then

            echo "Deleting existing ACI..."

            az container delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACI_NAME" \
              --yes

            echo "Existing ACI deleted."
          else
            echo "No existing ACI found."
          fi

      # 8. Create new Azure Container Instance
      - name: Deploy to Azure Container Instance
        shell: bash
        run: |
          az container create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACI_NAME" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --registry-login-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --dns-name-label azure-aci-cicd \
            --ports "$ACI_PORT" \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --restart-policy Always \
            --environment-variables PORT=8080

      # 9. Wait briefly for ACI to start
      - name: Wait for ACI
        shell: bash
        run: |
          echo "Waiting for ACI to start..."
          sleep 20

      # 10. Check ACI status
      - name: Check ACI Status
        shell: bash
        run: |
          echo "ACI state:"

          az container show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACI_NAME" \
            --query instanceView.state \
            --output tsv

      # 11. Show ACI logs
      - name: Show ACI Logs
        shell: bash
        run: |
          az container logs \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACI_NAME" || true

      # 12. Get application URL
      - name: Get Application URL
        shell: bash
        run: |
          FQDN=$(az container show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACI_NAME" \
            --query ipAddress.fqdn \
            --output tsv)

          echo "=================

